name: Jade Autism
description: >-
  Jade (Jade ND) is a Brazil-, UAE-, and UK-based education technology company building inclusive
  digital solutions for neurodivergent children, including those on the autism spectrum (ASD). Its
  product family includes Jade Edu (personalized-learning software for schools and educators), the
  Jade App (cognitive-development games for children, with 185,000+ downloads across 179 countries),
  Jade Astea (eye-tracking technology that assists professionals in evaluating autism-spectrum
  diagnosis), and Jade Academy (professional-development courses on inclusive and diverse education).
  Surfaced as a portfolio company of 500 Global and added to the API Evangelist network; the company
  publishes no public developer API, SDKs, or developer portal at this time.
